[package]
name = "rook-rainbow-quest"
version = "0.10.1"
default-run = "rook-rainbow-quest"
edition = "2021"
description = "A cheerful native desktop chess adventure for young children"

[[bin]]
name = "rook-rainbow-quest-launcher"
path = "src/bin/launcher.rs"

[dependencies]
macroquad = { version = "=0.4.14", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cozy-chess = "=0.3.4"

[profile.release]
lto = true
strip = false
debug = 1

